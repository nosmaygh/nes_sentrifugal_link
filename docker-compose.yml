services:
  web:
    build: .
    container_name: sentrifugo_app
    ports:
      - "8080:80"
    volumes:
      - ./sentrifugo:/var/www/html
    depends_on:
      - db
      - mailpit

  db:
    image: mysql:5.7
    container_name: sentrifugo_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sentrifugo
      MYSQL_USER: hr_user
      MYSQL_PASSWORD: hr_password
    ports:
      - "33066:3306"
    volumes:
      - db_data:/var/lib/mysql

  mailpit:
    image: axllent/mailpit
    container_name: sentrifugo_mail
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db_data: